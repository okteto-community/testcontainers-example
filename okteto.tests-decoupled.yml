name: testcontainers-example

build:
  # Compile only. The tests run with `okteto test`.
  app:
    dockerfile: Dockerfile.skip-tests

deploy:
  - envsubst < k8s.yml | kubectl apply -f -

test:
  unit:
    image: maven:3.9-eclipse-temurin-21
    context: .
    caches:
      - /root/.m2
    commands:
      - cp testcontainers.properties ~/.testcontainers.properties
      - mvn -B package
