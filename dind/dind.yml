# Docker daemon used by Testcontainers, deployed as a dependency in the same namespace.
# The Service is headless so "dind" resolves to the pod IP: Testcontainers publishes
# random ports on the daemon and needs to reach all of them, not only 2375.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dind
spec:
  replicas: 1
  # Never run two daemons at once: the headless Service would resolve "dind" to both pods
  # and Testcontainers could create a container in one and connect to the other.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dind
  template:
    metadata:
      labels:
        app: dind
    spec:
      containers:
        - name: dind
          image: docker:27-dind
          args: ["--tls=false"]
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          readinessProbe:
            exec:
              command: ["docker", "info"]
            periodSeconds: 5
          volumeMounts:
            - name: docker-data
              mountPath: /var/lib/docker
      volumes:
        # Bounded scratch space: if images and containers go over it, the pod is evicted and starts clean.
        - name: docker-data
          emptyDir:
            sizeLimit: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dind
spec:
  clusterIP: None
  selector:
    app: dind
  ports:
    - name: docker
      port: 2375
